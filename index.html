<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Message Center</title>
    <style>
        :root {
            --primary-blue: #2b85e4;
            --dark-blue: #1d71d3;
            --success: #52c41a;
            --error: #ff4d4f;
            --bg: #f0f2f5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: #333;
            overflow-x: hidden;
        }

        /* Mobile Header */
        header {
            background: var(--primary-blue);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Mobile Container - Full Width on small screens */
        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .account-info {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            border: 1px solid #e2e8f0;
        }

        .info-row { margin-bottom: 10px; }
        .info-row b { color: #64748b; font-size: 11px; text-transform: uppercase; display: block; }

        /* Form Styling */
        .field { margin-bottom: 18px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        label span { color: var(--error); }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px; /* Prevents iOS auto-zoom on focus */
            box-sizing: border-box;
        }

        /* Dynamic Flag & Phone Row */
        .phone-row {
            display: flex;
            gap: 8px;
        }
        .flag-box {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 0 10px;
            border-radius: 8px;
            white-space: nowrap;
            height: 48px;
        }
        .flag-box img { width: 20px; height: 14px; object-fit: cover; }
        .code { font-weight: bold; font-size: 14px; }

        /* Resizable Wrap */
        textarea {
            height: 120px;
            resize: vertical;
            min-height: 80px;
            line-height: 1.4;
        }

        .hint { font-size: 11px; color: #94a3b8; margin-top: 5px; }

        /* Mobile Action Button */
        .btn-send {
            width: 100%;
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-send:active { background: var(--dark-blue); transform: scale(0.98); }

        /* Toast Dialogue for Mobile */
        .toast {
            position: fixed;
            top: -100px;
            left: 5%;
            right: 5%;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            transition: top 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            border-left: 4px solid var(--success);
        }
        .toast.show { top: 20px; }
        .toast-icon { background: var(--success); color: white; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }

        .error { color: var(--error); font-size: 12px; display: none; margin-top: 4px; }
    </style>
</head>
<body>

<header>Send Inquiry</header>

<div id="toast" class="toast">
    <div class="toast-icon">✓</div>
    <div>
        <div style="font-weight:bold; font-size:14px;">Sent Successfully</div>
        <div style="font-size:12px; color:#666;">Supplier will be notified.</div>
    </div>
</div>

<div class="container">
    <div class="account-info">
        <div class="info-row">
            <b>From (Your Account)</b>
            homez24am@gmail.com
        </div>
        <div class="info-row" style="margin-bottom:0">
            <b>To (Supplier)</b>
            Mrs. Liyan (Liyan Textile Ltd.)
        </div>
    </div>

    <form id="mobileForm">
        <div class="field">
            <label><span>*</span>Full Name</label>
            <input type="text" id="name" placeholder="John Doe" required>
        </div>

        <div class="field">
            <label><span>*</span>Company Name</label>
            <input type="text" id="company" placeholder="Company Ltd" required>
        </div>

        <div class="field">
            <label><span>*</span>Country/Region</label>
            <select id="country" onchange="updateFlag()">
                <option value="ae" data-code="+971">United Arab Emirates</option>
                <option value="cn" data-code="+86">China</option>
                <option value="us" data-code="+1">United States</option>
                <option value="gb" data-code="+44">United Kingdom</option>
                <option value="in" data-code="+91">India</option>
                <option value="bd" data-code="+880">Bangladesh</option>
            </select>
        </div>

        <div class="field">
            <label><span>*</span>Contact Number</label>
            <div class="phone-row">
                <div class="flag-box">
                    <img id="flagImg" src="https://flagcdn.com/w40/ae.png" alt="flag">
                    <span class="code" id="codeTxt">+971</span>
                </div>
                <input type="tel" id="phone" placeholder="Mobile Number" required>
            </div>
            <div id="phoneErr" class="error">Enter a valid 7-15 digit number.</div>
        </div>

        <div class="field">
            <label><span>*</span>Message:</label>
            <textarea id="msg" placeholder="Detail your requirements here..."></textarea>
            <div class="hint">Min 20 characters. Drag box to resize.</div>
        </div>

        <button type="submit" class="btn-send">Send Inquiry Now</button>
    </form>
</div>

<script>
    const form = document.getElementById('mobileForm');
    const toast = document.getElementById('toast');
    const phone = document.getElementById('phone');
    const country = document.getElementById('country');
    const flagImg = document.getElementById('flagImg');
    const codeTxt = document.getElementById('codeTxt');

    function updateFlag() {
        const iso = country.value;
        const dial = country.options[country.selectedIndex].getAttribute('data-code');
        flagImg.src = `https://flagcdn.com/w40/${iso}.png`;
        codeTxt.innerText = dial;
    }

    // Number only validation
    phone.addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '');
    });

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Mobile Validation
        if (phone.value.length < 7 || phone.value.length > 15) {
            document.getElementById('phoneErr').style.display = 'block';
            phone.style.borderColor = 'var(--error)';
            return;
        }

        if (document.getElementById('msg').value.trim().length < 20) {
            alert("Message must be at least 20 characters.");
            return;
        }

        // Show Mobile Success Notification
        toast.classList.add('show');
        form.reset();
        updateFlag();

        // Hide after 5 seconds
        setTimeout(() => {
            toast.classList.remove('show');
        }, 5000);
    });
</script>

</body>
</html>
